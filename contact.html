<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Contact Us</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

            <h2>Contact Form</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" >

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="age">Age:</label>
                <input type="number" id="age" name="age">

                <label for="date">Date:</label>
                <input type="date" id="date" name="date">

                    <p>Are you a student?</p>

                    <input type="radio" id="yes" name="student" value="yes">
                    <label for="yes">Yes</label>

                    <input type="radio" id="no" name="student" value="no">
                    <label for="no">No</label>

                    <p>What are you interested in?</p>

                    <input type="checkbox" id="html" name="interest" value="html">
                    <label for="html">HTML</label>

                    <input type="checkbox" id="css" name="interest" value="css">
                    <label for="css">CSS</label>

                    <input type="checkbox" id="git" name="interest" value="git">
                    <label for="git">Git</label>

                <label for="course">Choose a course:</label>

                <select id="course" name="course">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="git">Git</option>
                </select>

                <label for="message">Message:</label>

                <textarea id="message" name="message" ></textarea>

                <button type="submit" class="submit">Submit</button>

            </form>

    </main>

    <footer>
        <p>&copy; 2026 My Project</p>
    </footer>

</body>
</html>
